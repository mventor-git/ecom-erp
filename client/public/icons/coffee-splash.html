<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Coffee Splash — Admin</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
         background:#f6f2e8; font-family:'Segoe UI',Tahoma,sans-serif; }
  h1 { font-size:15px; letter-spacing:.2em; text-transform:uppercase; color:#524c41; font-weight:600; }
  .cup { width:230px; height:auto; }
  .cs-stream { animation: cs-pour 2.6s cubic-bezier(.4,0,.2,1) infinite; transform-origin:100px -60px; }
  @keyframes cs-pour {
    0%{opacity:0;transform:translateY(-70px)} 12%{opacity:1;transform:translateY(0)}
    55%{opacity:1;transform:translateY(0)} 78%{opacity:0;transform:translateY(0)} 100%{opacity:0}
  }
  .cs-swirl { transform-box:fill-box; transform-origin:center; animation: cs-bloom 2.6s ease-in-out infinite; }
  .cs-swirl-b{animation-delay:.25s} .cs-swirl-c{animation-delay:.45s}
  @keyframes cs-bloom {
    0%{opacity:0;transform:scale(.2) rotate(0)} 30%{opacity:.95}
    60%{opacity:.7;transform:scale(1.15) rotate(140deg)} 100%{opacity:0;transform:scale(1.5) rotate(240deg)}
  }
  .cs-steam{animation:cs-steam 3.2s ease-in-out infinite} .cs-steam-2{animation-delay:1.1s}
  @keyframes cs-steam { 0%{opacity:0;transform:translateY(6px)} 35%{opacity:.6} 100%{opacity:0;transform:translateY(-14px)} }
</style>
</head>
<body>
<h1>Preparing your coffee…</h1>
<svg class="cup" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a33"/><stop offset="100%" stop-color="#4c2f18"/>
    </linearGradient>
    <radialGradient id="swirl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf6ec" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#e9d9c3" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#e9d9c3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="168" rx="58" ry="10" fill="#101c2c" opacity=".12"/>
  <path d="M138 96 q26 -2 24 20 q-2 22 -28 18" fill="none" stroke="#1f857a" stroke-width="11" stroke-linecap="round"/>
  <path d="M62 84 h76 l-7 62 q-1 12 -13 12 h-36 q-12 0 -13 -12 z" fill="#fff" stroke="#d8d2c4" stroke-width="3"/>
  <ellipse cx="100" cy="88" rx="38" ry="9.5" fill="url(#coffee)"/>
  <g class="cs-stream">
    <rect x="97" y="-60" width="7" height="150" rx="3.5" fill="#fff" opacity=".92"/>
    <circle cx="100.5" cy="90" r="5" fill="#fff" opacity=".9"/>
  </g>
  <ellipse class="cs-swirl" cx="100" cy="88" rx="16" ry="6" fill="url(#swirl)"/>
  <ellipse class="cs-swirl cs-swirl-b" cx="104" cy="87" rx="9" ry="3.4" fill="url(#swirl)"/>
  <ellipse class="cs-swirl cs-swirl-c" cx="96" cy="89" rx="5" ry="2.2" fill="url(#swirl)"/>
  <g fill="none" stroke="#b9b1a1" stroke-width="4" stroke-linecap="round" opacity=".55">
    <path class="cs-steam cs-steam-1" d="M86 56 q6 -12 0 -22 q-5 -9 2 -17"/>
    <path class="cs-steam cs-steam-2" d="M108 54 q7 -13 1 -24 q-5 -9 3 -16"/>
  </g>
</svg>
<p style="opacity:.5;font-size:13px">البين بيتصبّب في القهوة — نفس الأنيميشن هيظهر في لوجين وبداية الأدمن بانل</p>
</body>
</html>
